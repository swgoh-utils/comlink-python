site_name: swgoh_comlink
site_description: Python interfaces for swgoh-comlink and built-in StatCalc
site_url: https://swgoh-utils.github.io/comlink-python/
repo_name: swgoh-utils/comlink-python
repo_url: https://github.com/swgoh-utils/comlink-python
edit_uri: edit/develop/docs/

theme:
  name: material
  custom_dir: overrides
  palette:
    - scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode

nav:
  - "Home": index.md
  - "Guides":
      - "Install the v3 Alpha": v3/install-alpha.md
      - "Migrating from v2 to v3": v3/migration.md
      - "Migrating from v1.x": migration.md
      - "Logging": logging.md
      - "Examples": examples.md
  - "Recipes":
      - "Long-running Bot": v3/recipes/long-running-bot.md
      - "Bulk Analyst": v3/recipes/bulk-analyst.md
      - "Short-lived CLI Script": v3/recipes/cli-script.md
      - "Operator-side Concurrency": v3/recipes/operator-side-concurrency.md
      - "Typed StatCalc": v3/recipes/typed-statcalc.md
      - "Typed /data Segments": v3/recipes/typed-game-data-segments.md
  - "API":
      - "SwgohComlink": api/comlink.md
      - "SwgohComlinkAsync": api/async.md
      - "Typed Clients": api/typed.md
      - "StatCalc": api/statcalc.md
      - "Helpers": api/helpers.md
      - "Exceptions": api/exceptions.md
  - "Release Notes":
      - "v3.0.0a2": v3/releases/v3.0.0a2.md
      - "v3.0.0a1": v3/releases/v3.0.0a1.md

# Published but unlisted: the design records and v3 research notes that the
# guides link to. Listing them here keeps `mkdocs build` from reporting them.
not_in_nav: |
  /adr/
  /v3/README.md
  /v3/benchmark-report.md
  /v3/codegen.md
  /v3/phase-*.md
  /v3/releases/runbook-*.md

extra:
  # Versioned with mike: each release/* branch publishes its own folder on the
  # gh-pages branch (see "Publishing the docs" in CONTRIBUTING.md).
  version:
    provider: mike
    default: latest
    alias: true
  # Pre-release banner on every page (overrides/main.html). The deploy sets
  # DOCS_PRERELEASE from the release branch's version; local builds use the
  # default, which matches this line (3.x pre-releases).
  prerelease: !ENV [DOCS_PRERELEASE, true]

extra_css:
  - stylesheets/extra.css

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          paths:
            - src
          options:
            docstring_style: google
            docstring_options:
              warn_unknown_params: false
            show_source: false
            members_order: source

markdown_extensions:
  - admonition
  - toc:
      permalink: true
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.superfences
  - pymdownx.inlinehilite
