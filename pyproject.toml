[build-system]
requires = ["hatchling>=1.27.0", "hatch-vcs>=0.4.0"]
build-backend = "hatchling.build"

[project]
name = "swgoh_comlink"
dynamic = ["version"]
authors = [
    { name = "Mar Trepodi", email = "martrepodi@gmail.com" },
]
description = "Python 3 interface library for swgoh-comlink (https://github.com/swgoh-utils/swgoh-comlink)"
readme = "README.md"
requires-python = ">=3.11"
# PEP 639 license expression — do not also add a "License ::" classifier.
license = "MIT"
license-files = ["LICENSE"]
keywords = [
    "swgoh",
    "galaxy of heroes",
    "star wars",
    "comlink",
    "api-client",
    "async",
    "httpx",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: Implementation :: CPython",
    "Framework :: AsyncIO",
    "Topic :: Games/Entertainment",
    "Topic :: Internet :: WWW/HTTP",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed",
]
dependencies = [
    "httpx>=0.28",
    "msgspec>=0.18",
]

# ── Optional extras (Phase 6) ─────────────────────────────────────────────
#
# v3.0 ships:
#   [cache]      Phase 7 GameDataCache backing store
#   [pydantic]   compat.to_pydantic(struct, model_class) adapter
#   [all]        meta-extra: everything above
#
# Deferred (per ADRs / phase deviations):
#   [cli]        not needed -- migrate/ uses stdlib argparse, no click dep
#   [http2]      speculative; revisit if a recipe demands it
#   [brotli]     speculative; revisit if a recipe demands it
#   [ratelimit]  ADR-0004: deferred to v3.1
#   [circuitbreaker]  ADR-0004: deferred to v3.1
[project.optional-dependencies]
cache = [
    "diskcache>=5.6",
    "cachetools>=5.3",
]
pydantic = [
    "pydantic>=2.5",
]
all = [
    "swgoh-comlink[cache,pydantic]",
]

[project.scripts]
swgoh-migrate = "swgoh_comlink.migrate:main"

# Alpha-channel URLs (ADR-0008 addendum): the v3 pre-releases are hosted on
# the maintainer fork. Revert to swgoh-utils/comlink-python on reintegration.
[project.urls]
"Homepage" = "https://github.com/MarTrepodi/comlink-python"
"Bug Tracker" = "https://github.com/MarTrepodi/comlink-python/issues"
"Upstream (v2.x)" = "https://github.com/swgoh-utils/comlink-python"
Documentation = "https://swgoh-utils.github.io/comlink-python/"
Changelog = "https://github.com/MarTrepodi/comlink-python/blob/release/v3.0.0a1/CHANGELOG.md"
Discord = "https://discord.gg/6PBfG5MzR3"

[tool.pytest.ini_options]
addopts = [
    "--import-mode=importlib",
    "--strict-markers",
]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
    "integration: tests that require an accessible comlink service",
    "parity: tests that compare python stat calculation against JS baseline",
    "exhaustive: comprehensive pre-release validation tests",
    "cat_endpoints: sync and async endpoint functional tests",
    "cat_enums: enums=True parameter verification across endpoints",
    "cat_localization: localization bundle gzip/unzip processing tests",
    "cat_parity: sync vs async response parity verification",
    "cat_statcalc: StatCalc live calculation tests",
    "cat_builder: GameDataBuilder validation tests",
    "cat_helpers: helper function integration tests",
    "cat_errors: error handling and edge case tests",
    "cat_schemas: response structure contract validation",
    "cat_stress: load endurance and connection pool tests",
]

# Version is derived from the Git tag (e.g. v3.0.0a2) at build time.
# No version string is committed to the repo.
[tool.hatch.version]
source = "vcs"

# Write the resolved version to a generated, git-ignored module so it
# is importable at runtime (consumed by src/swgoh_comlink/version.py).
[tool.hatch.build.hooks.vcs]
version-file = "src/swgoh_comlink/_version.py"

[tool.hatch.build.targets.wheel]
packages = ["src/swgoh_comlink"]

[tool.hatch.build.targets.sdist]
include = [
    "/src",
    "/docs",
    "/README.md",
    "/CHANGELOG.md",
    "/LICENSE",
    "/pyproject.toml",
    "/mkdocs.yml",
]

[tool.uv.sources]
swgoh-comlink = { workspace = true }

[dependency-groups]
test = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "pytest-httpx>=0.35",
    "pytest-asyncio>=0.24",
]
bench = [
    "pympler>=1.0",
]
typecheck = [
    "ty>=0.0.34",
    # compat.py's TYPE_CHECKING import of pydantic must resolve for the
    # [pydantic] extra's adapter to be type-checked.
    "pydantic>=2.5",
]
codegen = [
    "jinja2>=3.1",
]
lint = [
    "ruff>=0.8",
]
changelog = [
    "git-changelog>=2.9,<3",
]
dev = [
    {include-group = "test"},
    {include-group = "typecheck"},
    {include-group = "bench"},
    {include-group = "codegen"},
    {include-group = "changelog"},
    {include-group = "lint"},
]
docs = [
    # MkDocs 2.0 removes the plugin system (mkdocstrings) and theme overrides that this
    # site depends on, with no migration path — stay on 1.x until the ecosystem settles.
    "mkdocs>=1.6,<2",
    "mkdocs-material>=9.5.0",
    "mkdocstrings[python]>=0.28.0",
]

# ── Ruff ─────────────────────────────────────────────────────────────────

[tool.ruff]
target-version = "py311"
line-length = 120
src = ["src", "tests"]
# hatch-vcs writes this file at build/sync time (git-ignored); it is
# machine-generated and not subject to lint/format gates.
extend-exclude = ["src/swgoh_comlink/_version.py"]

[tool.ruff.lint]
select = [
    "E",      # pycodestyle errors
    "F",      # pyflakes
    "W",      # pycodestyle warnings
    "I",      # isort (import sorting)
    "UP",     # pyupgrade (Python version upgrades)
    "B",      # flake8-bugbear (common bug patterns)
    "SIM",    # flake8-simplify
]
ignore = [
    "E501",   # line length — enforced at 120 by formatter, not linter
    "UP009",  # utf-8 encoding declarations — existing codebase convention
    "SIM108", # ternary operator — style preference, too many existing instances
    "SIM118", # dict.keys() — style preference, too many existing instances
]

[tool.ruff.lint.per-file-ignores]
# Existing violations to address incrementally — do not add new suppressions
"src/swgoh_comlink/__init__.py" = ["UP036"]   # outdated version block (sys.exit check)
"src/swgoh_comlink/helpers/*.py" = ["B007", "B904", "SIM102"]  # existing patterns to clean up
# Examples assign results to named variables to show what each call returns
"examples/**" = ["F841"]

[tool.ruff.lint.isort]
known-first-party = ["swgoh_comlink"]

[tool.ruff.format]
quote-style = "double"

# ── ty (Astral type checker) ─────────────────────────────────────────────

[tool.ty.environment]
python-version = "3.11"

# ── git-changelog ────────────────────────────────────────────────────────

[tool.git-changelog]
convention = "angular"
template = "angular"
provider = "github"
versioning = "pep440"
in-place = true
output = "CHANGELOG.md"
marker-line = "<!-- insertion marker -->"
bump = "auto"
# The angular convention renders only feat/fix/revert/refactor/perf by default.
# Listing them explicitly is what lets `docs` join them.
sections = ["feat", "fix", "revert", "refactor", "perf", "docs"]

# ── Coverage ─────────────────────────────────────────────────────────────

[tool.coverage.run]
source = ["swgoh_comlink"]

[tool.coverage.report]
# Ratchet: each phase may raise this number, never lower it without a
# documented reason in the corresponding phase report. Started at 40 in
# v2.x; Phase 1 raises to 90; Phase 6 nudges to 92; Phase 9 final
# exit gate at 95 (current actual ~96.5% on full suite).
fail_under = 95
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "if __name__ == .__main__.",
]
