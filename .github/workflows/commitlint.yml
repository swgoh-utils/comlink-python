name: Commit Lint

on:
  pull_request:
    branches: [main, develop]

permissions:
  contents: read

jobs:
  commitlint:
    name: Validate Commit Messages
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # Rules come from the committed .commitlintrc.json, and the commitlint, preset and
      # Node versions from the `commitlint` hook in .pre-commit-config.yaml. CI runs that
      # same hook through pre-commit rather than its own npm install, so local and CI
      # validation cannot drift.
      - name: Install uv
        uses: astral-sh/setup-uv@v7

      - name: Cache the pre-commit hook environment
        uses: actions/cache@v6
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-${{ runner.os }}-${{ hashFiles('.pre-commit-config.yaml') }}

      - name: Validate commits
        run: |
          set -euo pipefail
          git fetch --no-tags --quiet origin main
          base="${{ github.event.pull_request.base.sha }}"
          head="${{ github.event.pull_request.head.sha }}"
          # Lint only the commits this PR actually introduces: exclude merge
          # commits and any commit already reachable from main. Mergeback and
          # automated back-merge PRs re-introduce main's (sometimes
          # non-conventional squash) commits — those are already on main and are
          # not this PR's responsibility to police.
          commits="$(git rev-list --no-merges --reverse "${base}..${head}" --not FETCH_HEAD)"
          if [ -z "${commits}" ]; then
            echo "No PR-unique commits to lint (mergeback/back-merge or merge-only PR)."
            exit 0
          fi
          msg="${RUNNER_TEMP}/COMMIT_EDITMSG"
          rc=0
          while read -r sha; do
            echo "── ${sha} ──"
            git log -1 --format=%B "${sha}" > "${msg}"
            uvx pre-commit run commitlint --verbose \
              --hook-stage commit-msg --commit-msg-filename "${msg}" || rc=1
          done <<< "${commits}"
          exit "${rc}"
