name: Commit Lint

on:
  pull_request:
    branches: [main, develop]

permissions:
  contents: read

jobs:
  commitlint:
    name: Validate Commit Messages
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # Rules come from the committed .commitlintrc.json, and the commitlint, preset and
      # Node versions from the `commitlint` hook in .pre-commit-config.yaml. CI runs that
      # same hook through pre-commit rather than its own npm install, so local and CI
      # validation cannot drift.
      - name: Install uv
        uses: astral-sh/setup-uv@v7

      - name: Cache the pre-commit hook environment
        uses: actions/cache@v6
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-${{ runner.os }}-${{ hashFiles('.pre-commit-config.yaml') }}

      - name: Validate commits
        run: |
          set -euo pipefail
          git fetch --no-tags --quiet origin \
            +main:refs/remotes/origin/main +develop:refs/remotes/origin/develop
          base="${{ github.event.pull_request.base.sha }}"
          head="${{ github.event.pull_request.head.sha }}"
          # Lint only the commits this PR actually introduces: exclude merge
          # commits and any commit already reachable from main. Mergeback and
          # automated back-merge PRs re-introduce main's (sometimes
          # non-conventional squash) commits — those are already on main and are
          # not this PR's responsibility to police.
          landed=(origin/main)
          # A release PR into main carries every develop commit, and each one was
          # already linted (or exempted, as Dependabot's are below) by the PR that
          # landed it on develop. Without this, a release re-lints Dependabot's
          # "Bump ..." subjects outside a Dependabot PR and fails subject-case.
          if [ "${{ github.event.pull_request.base.ref }}" = "main" ]; then
            landed+=(origin/develop)
          fi
          commits="$(git rev-list --no-merges --reverse "${base}..${head}" --not "${landed[@]}")"
          # Dependabot copies its subject casing from repo history rather than from
          # dependabot.yml, so its "chore(deps): Bump ..." can fail subject-case. Its own
          # commits are machine-generated and never reach the changelog, so skip them —
          # but only on PRs Dependabot opened, so a forged author elsewhere is still
          # linted, and any human commit pushed onto a Dependabot PR still is too.
          if [ "${{ github.event.pull_request.user.login }}" = "dependabot[bot]" ]; then
            bot="49699333+dependabot[bot]@users.noreply.github.com"
            commits="$(git rev-list --no-merges --reverse --no-commit-header --format='%H %ae' \
              "${base}..${head}" --not "${landed[@]}" | awk -v bot="${bot}" '$2 != bot { print $1 }')"
            echo "Dependabot PR: skipping commits authored by ${bot}."
          fi
          if [ -z "${commits}" ]; then
            echo "No PR-unique commits to lint (mergeback/back-merge or merge-only PR)."
            exit 0
          fi
          msg="${RUNNER_TEMP}/COMMIT_EDITMSG"
          rc=0
          while read -r sha; do
            echo "── ${sha} ──"
            git log -1 --format=%B "${sha}" > "${msg}"
            uvx pre-commit run commitlint --verbose \
              --hook-stage commit-msg --commit-msg-filename "${msg}" || rc=1
          done <<< "${commits}"
          exit "${rc}"
