name: Commit Lint

on:
  pull_request:
    branches: [main, develop]

permissions:
  contents: read

jobs:
  commitlint:
    name: Validate Commit Messages
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # Rules come from the committed .commitlintrc.json — the same file the local
      # pre-commit commit-msg hook reads — so local and CI validation cannot drift.
      - name: Install commitlint
        run: npm install -g @commitlint/{cli,config-conventional}

      - name: Validate commits
        run: |
          set -euo pipefail
          git fetch --no-tags --quiet origin main
          base="${{ github.event.pull_request.base.sha }}"
          head="${{ github.event.pull_request.head.sha }}"
          # Lint only the commits this PR actually introduces: exclude merge
          # commits and any commit already reachable from main. Mergeback and
          # automated back-merge PRs re-introduce main's (sometimes
          # non-conventional squash) commits — those are already on main and are
          # not this PR's responsibility to police.
          commits="$(git rev-list --no-merges --reverse "${base}..${head}" --not FETCH_HEAD)"
          # Dependabot copies its subject casing from repo history rather than from
          # dependabot.yml, so its "chore(deps): Bump ..." can fail subject-case. Its own
          # commits are machine-generated and never reach the changelog, so skip them —
          # but only on PRs Dependabot opened, so a forged author elsewhere is still
          # linted, and any human commit pushed onto a Dependabot PR still is too.
          if [ "${{ github.event.pull_request.user.login }}" = "dependabot[bot]" ]; then
            bot="49699333+dependabot[bot]@users.noreply.github.com"
            commits="$(git rev-list --no-merges --reverse --no-commit-header --format='%H %ae' \
              "${base}..${head}" --not FETCH_HEAD | awk -v bot="${bot}" '$2 != bot { print $1 }')"
            echo "Dependabot PR: skipping commits authored by ${bot}."
          fi
          if [ -z "${commits}" ]; then
            echo "No PR-unique commits to lint (mergeback/back-merge or merge-only PR)."
            exit 0
          fi
          rc=0
          while read -r sha; do
            echo "── ${sha} ──"
            git log -1 --format=%B "${sha}" | npx commitlint --verbose || rc=1
          done <<< "${commits}"
          exit "${rc}"
