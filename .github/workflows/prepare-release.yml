name: prepare release

# Manually dispatched from `develop`. Computes the next version from Conventional
# Commits, regenerates CHANGELOG.md, and pushes a `release/<tag>` branch carrying the
# full develop payload plus the changelog commit. Merging that branch promotes develop ->
# main with the changelog already in place — BEFORE the release workflow cuts the tag.
#
# This workflow deliberately does NOT open the pull request. Opening it here would make
# the PR authored by github-actions[bot], and a bot-authored PR does not trigger the
# `pull_request` workflows (CI, Integration Tests, Commit Lint) that gate `main` — the
# release would arrive unverified. Instead the release PR text is written to a file on
# the release branch and a prefilled "create PR" link is put in the job summary, so a
# maintainer opens it in two clicks and the checks run as normal.

on:
  workflow_dispatch:
    inputs:
      bump:
        description: "Version bump (auto = infer from Conventional Commits)"
        type: choice
        options: [auto, patch, minor, major]
        default: auto

permissions:
  contents: write
  # Read merged PRs and their issues to restate closing keywords (closing_issues.py).
  pull-requests: read
  issues: read
  # Dispatch docs.yml on the release branch (see "Deploy the release docs").
  actions: write

jobs:
  prepare:
    name: Regenerate changelog and stage the release branch
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/develop'
    steps:
      - name: Check out develop
        uses: actions/checkout@v7
        with:
          ref: develop
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install changelog tooling
        run: uv sync --group changelog

      - name: Compute next version
        id: version
        run: |
          set -euo pipefail
          version="$(uv run git-changelog --bump '${{ inputs.bump }}' --bumped-version)"
          tag="v${version#v}"
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"
          echo "Next version: ${tag}"

      # git-changelog's angular convention counts ANY message line matching
      # ^break(s|ing changes?)?[ :] (case-insensitive) as breaking, so a wrapped body line
      # like "Breaking changes are ..." silently bumps the major. On a major, list every
      # triggering line in the job summary; with bump=auto, also stop here (before anything
      # is pushed) unless one of them is the exact "BREAKING CHANGE: <description>" footer.
      # An explicit bump=major is a human decision and is only reported, never blocked.
      - name: Check for an accidental major bump
        run: >-
          uv run python .github/tools/breaking_changes.py
          --bump '${{ inputs.bump }}'
          --next-tag '${{ steps.version.outputs.tag }}'

      - name: Regenerate CHANGELOG.md
        run: uv run git-changelog --bump '${{ inputs.bump }}'

      # Closing keywords ("Closes #12") only fire for PRs merged into the default branch, so
      # the ones in PRs merged into develop never close anything. Restate them in the release
      # PR, which does merge into main, so the issues close when the release lands.
      - name: Collect the issues this release closes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # Newest release tag, not `git describe`: until the post-release back-merge lands,
          # develop cannot reach the latest tag and describe would fall back to an older one.
          since="$(git tag --list 'v*' --sort=-v:refname | head -n1)"
          python3 .github/tools/closing_issues.py release --since "${since}" > "${RUNNER_TEMP}/closes.md"
          cat "${RUNNER_TEMP}/closes.md"

      - name: Write the release PR text
        id: pr_text
        run: |
          set -euo pipefail
          tag="${{ steps.version.outputs.tag }}"
          body_file=".github/release-pr/${tag}.md"
          mkdir -p "$(dirname "${body_file}")"

          # Pull just this version's section out of the freshly regenerated changelog:
          # start at its anchor, stop at the next one.
          notes="$(awk -v t="${tag}" \
            'BEGIN{p="^<a name=\""t"\"></a>$"} $0 ~ p {f=1} f && /^<a name=/ && ++n>1 {exit} f' \
            CHANGELOG.md)"

          {
            printf 'Automated release prep for **%s**. CHANGELOG.md regenerated via git-changelog.\n\n' "${tag}"
            printf 'Merging promotes `develop` -> `main` with the changelog already in place.\n'
            printf 'Afterwards, run the **release** workflow on `main` to build, publish, and tag %s.\n\n' "${tag}"
            cat "${RUNNER_TEMP}/closes.md"
            printf '\n---\n\n'
            printf '%s\n' "${notes}"
          } > "${body_file}"

          echo "body_file=${body_file}" >> "$GITHUB_OUTPUT"

      - name: Push the release branch
        run: |
          set -euo pipefail
          tag="${{ steps.version.outputs.tag }}"
          branch="release/${tag}"
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "${branch}"
          git add CHANGELOG.md "${{ steps.pr_text.outputs.body_file }}"
          # `chore` keeps this bookkeeping commit out of the rendered sections;
          # `docs` would list every release's regeneration in the next release.
          git commit -m "chore(changelog): update for ${tag}"
          git push --force-with-lease origin "${branch}"

      # A push made with GITHUB_TOKEN does not start workflows, so docs.yml's
      # `push: release/**` trigger never fires for the branch staged above.
      # workflow_dispatch is the documented exception, so start the deploy
      # explicitly: the release's docs publish (and take `latest` if it is the
      # newest stable) as soon as its branch exists.
      - name: Deploy the release docs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          branch="release/${{ steps.version.outputs.tag }}"
          gh workflow run docs.yml --repo "${{ github.repository }}" --ref "${branch}"
          echo "Dispatched docs.yml on ${branch}."

      - name: Summarise how to open the release PR
        run: |
          set -euo pipefail
          tag="${{ steps.version.outputs.tag }}"
          branch="release/${tag}"
          body_file="${{ steps.pr_text.outputs.body_file }}"
          title="chore(release): ${tag}"
          # Only the title is prefilled via the URL: bodies routinely exceed what a query
          # string can carry, so the body is copied from the file on the branch instead.
          encoded_title="$(jq -rn --arg t "${title}" '$t|@uri')"
          url="${{ github.server_url }}/${{ github.repository }}/compare/main...${branch}?expand=1&title=${encoded_title}"

          {
            printf '## %s is staged\n\n' "${tag}"
            printf 'Branch `%s` is pushed. Open the PR manually — a bot-authored PR would not run the `pull_request` checks that gate `main`.\n\n' "${branch}"
            printf '### [→ Open the release PR](%s)\n\n' "${url}"
            printf 'Base `main`, head `%s`, title:\n\n```\n%s\n```\n\n' "${branch}" "${title}"
            printf 'The body below is also committed to `%s` on that branch — copy it in:\n\n' "${body_file}"
            printf -- '---\n\n'
            cat "${body_file}"
          } >> "$GITHUB_STEP_SUMMARY"
