name: CI

on:
  pull_request:
    branches: [main, develop, "v3.3-research", "release/v*"]
  push:
    branches: [main, develop, "v3.3-research", "release/v*"]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:

  # ── Lint ───────────────────────────────────────────────────────────────
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: uv sync --locked --only-group lint

      - name: Run Ruff linter
        run: uv run --no-sync ruff check src/ tests/ examples/ parity/

      - name: Run Ruff formatter check
        run: uv run --no-sync ruff format --check src/ tests/ examples/ parity/

  # ── Type check ─────────────────────────────────────────────────────────
  type-check:
    name: Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: uv sync --group typecheck

      - name: Run ty
        run: uv run ty check src/swgoh_comlink/

  # ── Codegen drift ──────────────────────────────────────────────────────
  # The four client files are generated from the endpoint manifest; fail if
  # the committed output diverges (run `make generate` locally to fix).
  codegen:
    name: Codegen drift
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: uv sync --group codegen --group lint

      - name: Check generated clients are up to date
        run: make generate-check

  # ── Test ───────────────────────────────────────────────────────────────
  test:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        # --all-extras: the suite exercises the [cache] and [pydantic]
        # optional extras directly (tests/unit/test_statcalc_v3_2.py,
        # tests/v3/test_cache.py, tests/v3/test_optional.py), and the 95%
        # coverage gate is calibrated with them installed.
        run: uv sync --group test --all-extras

      - name: Run tests with coverage
        run: |
          uv run python -m pytest tests/ \
            --cov=swgoh_comlink \
            --cov-report=term-missing \
            --cov-report=xml:coverage.xml \
            -v

      - name: Upload coverage artifact
        if: matrix.python-version == '3.12'
        uses: actions/upload-artifact@v7
        with:
          name: coverage-report
          path: coverage.xml

  # ── Docs build ────────────────────────────────────────────────────────
  docs:
    name: Docs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: uv sync --group docs

      - name: Build docs
        run: uv run mkdocs build

  # ── Build verification ─────────────────────────────────────────────────
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Check README links are absolute
        # README.md is also the PyPI project description, where relative links resolve
        # against pypi.org and 404. Link to GitHub (or the docs site) with full URLs.
        run: |
          if grep -nP '\]\((?!https?://|#|mailto:)' README.md; then
            echo "::error file=README.md::Use absolute URLs in README.md; relative links break on PyPI."
            exit 1
          fi

      - name: Build package
        run: uvx hatch build

      - name: Verify wheel contents
        run: |
          uv pip install --system dist/*.whl
          python -c "from swgoh_comlink import SwgohComlink; print('Import OK')"
