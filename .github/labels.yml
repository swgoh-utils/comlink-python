# Declarative GitHub label catalog. Synced to the repo's issue
# labels by .github/workflows/label-sync.yml via EndBug/label-sync.
#
# Color convention:
#   - red shades  → bugs / blockers
#   - green       → enhancement / new feature
#   - blue shades → version (v2, v3)
#   - yellow      → triage / needs-info / questions
#   - purple      → security / dependencies
#   - grey        → maintenance / docs / ci
#
# When adding a new label, also document it in CONTRIBUTING.md
# under "Canonical labels" so contributors know it's available.

# ── Bug / quality ───────────────────────────────────────────────────────────
- name: bug
  color: "d73a4a"
  description: "Something isn't working correctly"

- name: security
  color: "5319e7"
  description: "Security-related issue or PR"

# ── New work ────────────────────────────────────────────────────────────────
- name: enhancement
  color: "a2eeef"
  description: "New feature or capability"

- name: "feature request"
  color: "0e8a16"
  description: "Community-requested feature"

# ── Version disambiguation (v2 stable on PyPI vs v3 alpha on GitHub Releases) ─
- name: v2
  color: "1f6feb"
  description: "Pertains to v2 (the PyPI-stable surface)"

- name: v3
  color: "1d76db"
  description: "Pertains to the v3 alpha (GitHub Releases only — see ADR-0008)"

# ── Maintenance ─────────────────────────────────────────────────────────────
- name: "code maintenance"
  color: "cfd3d7"
  description: "Internal cleanup, refactoring, or tech debt"

- name: testing
  color: "fbca04"
  description: "Test coverage or test infrastructure"

- name: documentation
  color: "0075ca"
  description: "Documentation, README, or docs site changes"

- name: ci
  color: "ededed"
  description: "GitHub Actions workflows or other CI infrastructure"

- name: dependencies
  color: "0366d6"
  description: "Updates to project dependencies"

- name: code
  color: "c5def5"
  description: "Source-code changes under src/"
