name: Bug Report
description: Report a bug in comlink-python
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug!

        - **Security vulnerability?** Do not open a public issue — use [private vulnerability reporting](https://github.com/swgoh-utils/comlink-python/security/advisories/new) instead. See [SECURITY.md](https://github.com/swgoh-utils/comlink-python/blob/main/SECURITY.md).
        - **Problem with the comlink service itself** (wrong game data, service crashes, Docker image)? Report it to [swgoh-comlink](https://github.com/swgoh-utils/swgoh-comlink/issues).

  - type: checkboxes
    id: preflight
    attributes:
      label: Before submitting
      options:
        - label: I have searched [existing issues](https://github.com/swgoh-utils/comlink-python/issues?q=is%3Aissue) and this has not been reported yet.
          required: true
        - label: I can reproduce this on the latest release of `swgoh_comlink`.
          required: false
        - label: I have removed any `access_key` / `secret_key` values and other secrets from the information below.
          required: true

  - type: dropdown
    id: component
    attributes:
      label: Component
      description: Which part of the library is affected?
      options:
        - SwgohComlink (sync client)
        - SwgohComlinkAsync (async client)
        - StatCalc / GameDataBuilder
        - Helpers
        - swgoh-migrate tool
        - Packaging / installation
        - Other / not sure
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: Bug Description
      description: A clear description of what the bug is.
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Steps to Reproduce
      description: Minimal, self-contained code that reproduces the issue.
      render: python
      placeholder: |
        from swgoh_comlink import SwgohComlink

        comlink = SwgohComlink()
        # ...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: What you expected to happen.
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual Behavior
      description: What actually happened.
    validations:
      required: true

  - type: textarea
    id: traceback
    attributes:
      label: Traceback / Logs
      description: Full traceback or relevant log output, if any. This is rendered as code automatically, so no backticks are needed.
      render: shell

  - type: input
    id: package-version
    attributes:
      label: Package Version
      description: 'Output of `python -c "import swgoh_comlink; print(swgoh_comlink.version)"`'
      placeholder: "2.4.0"
    validations:
      required: true

  - type: input
    id: python-version
    attributes:
      label: Python Version
      description: Output of `python --version`
      placeholder: "3.12.0"
    validations:
      required: true

  - type: input
    id: os
    attributes:
      label: Operating System
      placeholder: "macOS 15, Ubuntu 24.04, Windows 11, ..."

  - type: input
    id: comlink-version
    attributes:
      label: Comlink Service Version (if applicable)
      description: The version of the swgoh-comlink service you are connecting to.
      placeholder: "e.g. 4.5.0"
