name: Bug Report
description: Report a bug in comlink-python
labels: ["bug"]
body:
  - type: dropdown
    id: version-line
    attributes:
      label: Which version line?
      description: |
        Select the version line your bug applies to. Triagers will
        apply the matching `v2` / `v3` label so the bug is routed
        to the right backlog. If you're unsure, run
        `python -c "import swgoh_comlink; print(swgoh_comlink.version)"`
        — `2.x.x` is v2, `3.x.x` is v3.
      options:
        - "v2 (PyPI stable — `pip install swgoh_comlink`)"
        - "v3 (alpha — installed from GitHub Releases or git ref)"
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: Bug Description
      description: A clear description of what the bug is.
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Steps to Reproduce
      description: Minimal code or steps to reproduce the issue.
      placeholder: |
        from swgoh_comlink import SwgohComlink
        comlink = SwgohComlink()
        # ...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: What you expected to happen.
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual Behavior
      description: What actually happened. Include full traceback if applicable.
    validations:
      required: true

  - type: input
    id: python-version
    attributes:
      label: Python Version
      placeholder: "3.12.0"
    validations:
      required: true

  - type: input
    id: package-version
    attributes:
      label: Package Version
      placeholder: "1.17.0"
    validations:
      required: true

  - type: input
    id: comlink-version
    attributes:
      label: Comlink Service Version (if applicable)
      placeholder: "0.38.1"
