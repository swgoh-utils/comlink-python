name: Documentation
description: Report missing, unclear, or incorrect documentation
labels: ["documentation"]
body:
  - type: input
    id: location
    attributes:
      label: Location
      description: URL, file path, or docstring (e.g. `README.md`, `docs/migration.md`, `SwgohComlink.get_player`).
    validations:
      required: true

  - type: textarea
    id: problem
    attributes:
      label: What's wrong or missing?
    validations:
      required: true

  - type: textarea
    id: suggestion
    attributes:
      label: Suggested improvement
      description: Optional — proposed wording or content.
