# Pre-commit hooks mirroring the CI workflow checks.
# Install: pre-commit install
# Run all: pre-commit run --all-files

repos:
  # ── General file hygiene ──────────────────────────────────────────────
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
        # mkdocs.yml uses MkDocs' `!ENV` tag, which the safe loader rejects;
        # `mkdocs build --strict` (CI's docs job) validates it instead.
        exclude: ^mkdocs\.yml$
      - id: check-toml
      - id: check-added-large-files
        # Cassettes under benchmarks/v3/fixtures/ are intentionally large
        # (the full /data dump is ~15 MiB gzipped and load-bearing for the
        # Phase 3 msgspec headline numbers). Bump the threshold from the
        # 500 KiB default to 20 MiB so they fit.
        args: [--maxkb=20480]
      - id: debug-statements

  # ── Ruff linter & formatter (mirrors CI lint job) ─────────────────────
  # Run via local uv so the version comes from uv.lock, same as CI.
  - repo: local
    hooks:
      - id: ruff
        name: ruff check
        entry: uv run ruff check --fix --force-exclude
        language: system
        types: [python]
        require_serial: true
      - id: ruff-format
        name: ruff format
        entry: uv run ruff format --force-exclude
        language: system
        types: [python]
        require_serial: true

  # ── ty type checking (Astral, run via local uv) ───────────────────────
  - repo: local
    hooks:
      - id: ty
        name: ty check
        entry: uv run ty check
        language: system
        files: ^src/swgoh_comlink/
        types: [python]

  # ── Codegen drift check ───────────────────────────────────────────────
  # If the manifest, template, or generator changes, ensure the four
  # generated client files were regenerated and committed alongside.
  # Refuses the commit otherwise.
  - repo: local
    hooks:
      - id: codegen-drift
        name: codegen drift (manifest vs generated clients)
        entry: make generate-check
        language: system
        pass_filenames: false
        files: ^src/swgoh_comlink/(_codegen/|_escape_hatches_(sync|async)\.py|swgoh_comlink(_async)?\.py|typed/swgoh_comlink(_async)?\.py)

  # ── Commitlint (CI's Commit Lint job runs this exact hook) ────────────
  # Every version is pinned here and nowhere else: .github/workflows/commitlint.yml
  # invokes this hook through pre-commit, so local and CI linting cannot drift. A
  # third-party hook rev would only pin a caret range (its lockfile is not honoured),
  # and commitlint changes rule behaviour across majors. Bump cli and
  # config-conventional together; language_version makes pre-commit fetch its own Node
  # (commitlint 21 needs >= 22.12) instead of depending on whatever is installed.
  - repo: local
    hooks:
      - id: commitlint
        name: commitlint
        entry: commitlint --edit
        language: node
        language_version: "24.21.0"
        stages: [commit-msg]
        additional_dependencies:
          - "@commitlint/cli@21.2.3"
          - "@commitlint/config-conventional@21.2.3"
