# Pre-commit hooks mirroring the CI workflow checks.
# Install: pre-commit install
# Run all: pre-commit run --all-files

repos:
  # ── General file hygiene ──────────────────────────────────────────────
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-toml
      - id: check-added-large-files
        # Cassettes under benchmarks/v3/fixtures/ are intentionally large
        # (the full /data dump is ~15 MiB gzipped and load-bearing for the
        # Phase 3 msgspec headline numbers). Bump the threshold from the
        # 500 KiB default to 20 MiB so they fit.
        args: [--maxkb=20480]
      - id: debug-statements

  # ── Ruff linter & formatter (mirrors CI lint job) ─────────────────────
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.4
    hooks:
      - id: ruff
        args: [--fix]
        exclude: ^examples/
      - id: ruff-format

  # ── Mypy type checking (mirrors CI type-check job) ────────────────────
  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.19.1
    hooks:
      - id: mypy
        files: ^src/swgoh_comlink/
        # Match the runtime SDK deps + every optional-extra dep that ships
        # type stubs. Without these, mypy --strict in the isolated hook env
        # treats them all as Any and emits spurious "unused type: ignore"
        # vs "no-any-return" depending on which arrives first.
        additional_dependencies:
          - httpx>=0.28
          - msgspec>=0.18
          - pydantic>=2.5
          - diskcache>=5.6
          - cachetools>=5.3
        args: [--strict, --ignore-missing-imports]

  # ── Commitlint (mirrors CI commitlint job) ────────────────────────────
  - repo: https://github.com/alessandrojcm/commitlint-pre-commit-hook
    rev: v9.21.0
    hooks:
      - id: commitlint
        stages: [commit-msg]
        additional_dependencies: ["@commitlint/config-conventional"]
