# Pre-commit hooks mirroring the CI workflow checks.
# Install: pre-commit install
# Run all: pre-commit run --all-files

repos:
  # ── General file hygiene ──────────────────────────────────────────────
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-toml
      - id: check-added-large-files
        # Cassettes under benchmarks/v3/fixtures/ are intentionally large
        # (the full /data dump is ~15 MiB gzipped and load-bearing for the
        # Phase 3 msgspec headline numbers). Bump the threshold from the
        # 500 KiB default to 20 MiB so they fit.
        args: [--maxkb=20480]
      - id: debug-statements

  # ── Ruff linter & formatter (mirrors CI lint job) ─────────────────────
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.4
    hooks:
      - id: ruff
        args: [--fix]
        exclude: ^examples/
      - id: ruff-format

  # ── ty type checking (Astral, run via local uv) ───────────────────────
  - repo: local
    hooks:
      - id: ty
        name: ty check
        entry: uv run ty check
        language: system
        files: ^src/swgoh_comlink/
        types: [python]

  # ── Codegen drift check ───────────────────────────────────────────────
  # If the manifest, template, or generator changes, ensure the four
  # generated client files were regenerated and committed alongside.
  # Refuses the commit otherwise.
  - repo: local
    hooks:
      - id: codegen-drift
        name: codegen drift (manifest vs generated clients)
        entry: make generate-check
        language: system
        pass_filenames: false
        files: ^src/swgoh_comlink/(_codegen/|_escape_hatches_(sync|async)\.py|swgoh_comlink(_async)?\.py|typed/swgoh_comlink(_async)?\.py)

  # ── Commitlint (mirrors CI commitlint job) ────────────────────────────
  - repo: https://github.com/alessandrojcm/commitlint-pre-commit-hook
    rev: v9.21.0
    hooks:
      - id: commitlint
        stages: [commit-msg]
        additional_dependencies: ["@commitlint/config-conventional"]
