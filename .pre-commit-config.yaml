# Pre-commit hooks mirroring the CI workflow checks.
# Install: pre-commit install
# Run all: pre-commit run --all-files

repos:
  # ── General file hygiene ──────────────────────────────────────────────
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-toml
      - id: check-added-large-files
      - id: debug-statements

  # ── Ruff linter & formatter (mirrors CI lint job) ─────────────────────
  # Run via local uv so the version comes from uv.lock, same as CI.
  - repo: local
    hooks:
      - id: ruff
        name: ruff check
        entry: uv run ruff check --fix --force-exclude
        language: system
        exclude: ^examples/
        types: [python]
        require_serial: true
      - id: ruff-format
        name: ruff format
        entry: uv run ruff format --force-exclude
        language: system
        types: [python]
        require_serial: true

  # ── ty type checking (Astral, run via local uv) ───────────────────────
  - repo: local
    hooks:
      - id: ty
        name: ty check
        entry: uv run ty check
        language: system
        files: ^src/swgoh_comlink/
        types: [python]

  # ── Commitlint (mirrors CI commitlint job) ────────────────────────────
  - repo: https://github.com/alessandrojcm/commitlint-pre-commit-hook
    rev: v9.21.0
    hooks:
      - id: commitlint
        stages: [commit-msg]
        additional_dependencies: ["@commitlint/config-conventional"]
